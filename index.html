<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>TheOdinProject</title>
</head>
<body>
    <div class="left__container">
        <div class="logo__container">
            <img src="images/odin-lined.png" alt="logo">
            <h1>ODIN</h1>
        </div>
    </div>

    <div class="right__container">
        <div class="right__container__header">
            <p>
                This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. <br>
                Sign up now to get started.
                <br>
                <br>
                You know you want to.
            </p>
        </div>
        <div class="right__container__form">
            <h2>
                Let's do this!
            </h2>
            <form>
                <div class="form__row">
                    <div class="form__field">
                        <label for="firstname">
                            FIRST NAME  
                        </label>
                        <input type="text" id="firstname" name="firstname" placeholder="Shakhzod" required>
                    </div>
                    <div class="form__field">
                        <label for="lastname">
                            LAST NAME
                        </label>
                        <input type="text" id="lastname" name="lastname" placeholder="Fakhriddinov" required>
                    </div>
                </div>

                <div class="form__row">
                    <div class="form__field">
                        <label for="email">
                            EMAIL
                        </label>
                        <input type="text" id="email" name="email" required>
                    </div>
                        <div class="form__field">
                        <label for="phonenumber">
                            PHONE NUMBER
                        </label>
                        <input type="text" id="phonenumber" name="phonenumber" required>
                    </div>
                </div>
                
                <div class="form__row">
                    <div class="form__field">
                        <label for="password">
                            PASSWORD
                        </label>
                        <input type="text" id="password" name="password" required>
                    </div>
                        <div class="form__field">
                        <label for="confirmpassword">
                            CONFIRM PASSWORD
                        </label>
                        <input type="text" id="confirmpassword" name="confirmpassword" required>
                    </div>
                </div>
            </form>
        </div>

        <div class="right__container__footer">
            <button type="submit">
                Create Account
            </button>
            <p>
                Already have an account?
                <a href="#">Log in</a>
            </p>
        </div>
    </div>

    <script src="./app.js"></script>

</body>
</html>
